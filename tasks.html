<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Hamplus Intern Portal</title>
  <link rel="icon" type="image/jpeg" href="assets/hamplus-logo.jpg">
  <link rel="apple-touch-icon" href="assets/hamplus-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Assigned Tasks</h1>
            <p class="page-subtitle">Track project deliverables, deadlines, and update progress for Hamplus Hub supervisors.</p>
          </div>
        </div>

        <!-- Filter Tabs Toolbar -->
        <div class="card mb-4 shadow-sm border">
          <div class="card-body py-2 px-3">
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <span class="fs-7 fw-semibold text-muted me-2"><i class="fa-solid fa-filter me-1"></i>Filter:</span>
              <button class="btn btn-sm btn-outline-secondary task-filter-btn active" data-filter="all">
                All Tasks <span class="badge bg-secondary ms-1" id="countAll">0</span>
              </button>
              <button class="btn btn-sm btn-outline-secondary task-filter-btn" data-filter="pending">
                Pending <span class="badge bg-secondary ms-1" id="countPending">0</span>
              </button>
              <button class="btn btn-sm btn-outline-info task-filter-btn" data-filter="in_progress">
                In Progress <span class="badge bg-info ms-1" id="countInProgress">0</span>
              </button>
              <button class="btn btn-sm btn-outline-success task-filter-btn" data-filter="completed">
                Completed <span class="badge bg-success ms-1" id="countCompleted">0</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Tasks Cards Grid -->
        <div id="internTasksContainer">
          <div class="loading-overlay">
            <div class="spinner-border text-primary me-2"></div> Loading your tasks...
          </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state d-none" id="tasksEmptyState">
          <div class="empty-state-icon fs-2"><i class="fa-solid fa-list-check"></i></div>
          <div class="empty-state-title">No Tasks Found</div>
          <p class="empty-state-text">There are currently no tasks matching your selected filter.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Task Details Modal -->
  <div class="modal fade" id="taskDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="modalTaskTitle">Task Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <div class="mb-3">
            <label class="form-label text-muted fs-8 text-uppercase">Description</label>
            <p class="fs-7 text-dark mb-0" id="modalTaskDescription"></p>
          </div>

          <div class="row g-2 mb-3 bg-light p-3 rounded">
            <div class="col-6">
              <span class="fs-8 text-muted d-block">Priority</span>
              <span class="fw-bold fs-7 text-dark" id="modalTaskPriority"></span>
            </div>
            <div class="col-6">
              <span class="fs-8 text-muted d-block">Assigned Date</span>
              <span class="fs-7 text-dark" id="modalTaskAssignedDate"></span>
            </div>
            <div class="col-12 mt-2 pt-2 border-top">
              <span class="fs-8 text-muted d-block">Deadline</span>
              <span class="fw-bold fs-7 text-danger" id="modalTaskDeadline"></span>
            </div>
          </div>

          <div class="mb-3 d-none" id="modalSupervisorNotesBox">
            <label class="form-label text-muted fs-8 text-uppercase"><i class="fa-solid fa-comment-dots text-primary me-1"></i>Supervisor Notes</label>
            <div class="p-2 bg-info-subtle text-dark rounded fs-8 border border-info-subtle" id="modalSupervisorNotesText"></div>
          </div>
        </div>
        <div class="modal-footer border-top bg-light">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <div id="modalTaskActionContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
