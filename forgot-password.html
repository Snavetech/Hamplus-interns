<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Hamplus Intern Portal</title>
  <link rel="icon" type="image/jpeg" href="assets/hamplus-logo.jpg">
  <link rel="apple-touch-icon" href="assets/hamplus-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-identity mb-2 text-decoration-none d-flex align-items-center justify-content-center gap-2">
          <img src="assets/hamplus-logo.jpg" alt="Hamplus Logo" class="brand-logo" width="38" height="38">
          <div class="text-start">
            <span class="brand-name">HAM<span style="color: #FF7A00;">PLUS</span></span>
            <span class="brand-label">INTERN PORTAL</span>
          </div>
        </a>
        <p class="text-muted fs-7 mb-0">Reset your portal password</p>
      </div>

      <div class="auth-body">
        <div id="resetAlert" class="alert d-none py-2 px-3 fs-7 mb-3" role="alert"></div>

        <p class="text-muted fs-7 mb-4">
          Enter your registered internship email address. We will verify your account and initiate the password reset procedure.
        </p>

        <form id="resetForm" novalidate>
          <div class="mb-4">
            <label for="resetEmailInput" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-envelope"></i></span>
              <input 
                type="email" 
                class="form-control" 
                id="resetEmailInput" 
                placeholder="intern@hamplus.com" 
                required 
                autocomplete="email"
              >
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fs-7 fw-semibold mb-3" id="resetSubmitBtn">
            <span id="resetBtnText"><i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link</span>
            <span id="resetBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>

          <div class="text-center">
            <a href="login.html" class="text-muted fs-7 text-decoration-none">
              <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
            </a>
          </div>
        </form>
      </div>

      <div class="auth-footer text-muted fs-8">
        Hamplus Hub Abraka &bull; Technical Support &bull; <a href="login.html" class="fw-semibold">Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const resetForm = document.getElementById("resetForm");
      const emailInput = document.getElementById("resetEmailInput");
      const submitBtn = document.getElementById("resetSubmitBtn");
      const btnText = document.getElementById("resetBtnText");
      const btnSpinner = document.getElementById("resetBtnSpinner");
      const resetAlert = document.getElementById("resetAlert");

      function showAlert(msg, type = "danger") {
        resetAlert.className = `alert alert-${type} py-2 px-3 fs-7 mb-3`;
        resetAlert.textContent = msg;
        resetAlert.classList.remove("d-none");
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          btnText.classList.add("d-none");
          btnSpinner.classList.remove("d-none");
        } else {
          btnText.classList.remove("d-none");
          btnSpinner.classList.add("d-none");
        }
      }

      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) {
          showAlert("Please provide your registered email address.", "danger");
          return;
        }

        setLoading(true);
        resetAlert.classList.add("d-none");

        try {
          await HamplusAuth.requestPasswordReset(email);
          showAlert("Password reset instructions have been dispatched to your email address.", "success");
          emailInput.value = "";
        } catch (err) {
          showAlert(err.message || "Failed to process request. Please check email address.", "danger");
        } finally {
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
