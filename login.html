<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Hamplus Intern Portal</title>
  <link rel="icon" type="image/jpeg" href="assets/hamplus-logo.jpg">
  <link rel="apple-touch-icon" href="assets/hamplus-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-identity mb-2 text-decoration-none d-flex align-items-center justify-content-center gap-2">
          <img src="assets/hamplus-logo.jpg" alt="Hamplus Logo" class="brand-logo" width="38" height="38">
          <div class="text-start">
            <span class="brand-name">HAM<span style="color: #FF7A00;">PLUS</span></span>
            <span class="brand-label">INTERN PORTAL</span>
          </div>
        </a>
        <p class="text-muted fs-7 mb-0">Sign in to your internship account</p>
      </div>

      <div class="auth-body">
        <!-- Alert feedback message container -->
        <div id="loginAlert" class="alert d-none py-2 px-3 fs-7 mb-3" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="emailInput" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-envelope"></i></span>
              <input 
                type="email" 
                class="form-control" 
                id="emailInput" 
                placeholder="intern@hamplus.com" 
                required 
                autocomplete="email"
              >
            </div>
            <div class="invalid-feedback fs-8">Please enter a valid email address.</div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="passwordInput" class="form-label mb-0">Password</label>
              <a href="forgot-password.html" class="fs-8 text-decoration-none">Forgot password?</a>
            </div>
            <div class="password-toggle-wrapper">
              <div class="input-group">
                <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-lock"></i></span>
                <input 
                  type="password" 
                  class="form-control" 
                  id="passwordInput" 
                  placeholder="Enter your password" 
                  required 
                  autocomplete="current-password"
                >
                <button type="button" class="btn btn-outline-secondary" id="togglePasswordBtn" title="Toggle password visibility">
                  <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>
            <div class="invalid-feedback fs-8">Password cannot be empty.</div>
          </div>

          <div class="mb-4 d-flex align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMeCheckbox" checked>
              <label class="form-check-label fs-7 text-muted" for="rememberMeCheckbox">
                Remember my session
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fs-7 fw-semibold" id="loginSubmitBtn">
            <span id="btnText"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Quick Demo Switcher for fast testing -->
        <div class="demo-credentials-box">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="fw-bold text-dark fs-8"><i class="fa-solid fa-key text-primary me-1"></i>Quick Demo Login:</span>
            <span class="text-muted fs-8">Select a role</span>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary flex-fill py-1 fs-8" id="quickInternBtn">
              <i class="fa-solid fa-user-graduate me-1"></i> Intern Account
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark flex-fill py-1 fs-8" id="quickSupervisorBtn">
              <i class="fa-solid fa-user-shield me-1"></i> Supervisor
            </button>
          </div>
        </div>
      </div>

      <div class="auth-footer text-muted fs-8">
        Need assistance with your account? Contact <strong class="text-dark">Hamplus Hub Abraka</strong> administration.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Redirect if user is already authenticated
      await HamplusAuth.redirectIfAuthenticated();

      const loginForm = document.getElementById("loginForm");
      const emailInput = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const rememberCheckbox = document.getElementById("rememberMeCheckbox");
      const submitBtn = document.getElementById("loginSubmitBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const loginAlert = document.getElementById("loginAlert");

      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const togglePasswordIcon = document.getElementById("togglePasswordIcon");

      // Password toggle
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        togglePasswordIcon.classList.toggle("fa-eye", !isPassword);
        togglePasswordIcon.classList.toggle("fa-eye-slash", isPassword);
      });

      // Quick autofill buttons
      document.getElementById("quickInternBtn").addEventListener("click", () => {
        emailInput.value = "intern@hamplus.com";
        passwordInput.value = "password123";
        showAlert("Filled Blessing Adeleke (Intern) demo credentials.", "info");
      });

      document.getElementById("quickSupervisorBtn").addEventListener("click", () => {
        emailInput.value = "supervisor@hamplus.com";
        passwordInput.value = "password123";
        showAlert("Filled Engr. David Okonkwo (Supervisor) demo credentials.", "info");
      });

      function showAlert(msg, type = "danger") {
        loginAlert.className = `alert alert-${type} py-2 px-3 fs-7 mb-3`;
        loginAlert.textContent = msg;
        loginAlert.classList.remove("d-none");
      }

      function hideAlert() {
        loginAlert.classList.add("d-none");
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          btnText.classList.add("d-none");
          btnSpinner.classList.remove("d-none");
        } else {
          btnText.classList.remove("d-none");
          btnSpinner.classList.add("d-none");
        }
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) {
          emailInput.classList.add("is-invalid");
          return;
        } else {
          emailInput.classList.remove("is-invalid");
        }

        if (!password) {
          passwordInput.classList.add("is-invalid");
          return;
        } else {
          passwordInput.classList.remove("is-invalid");
        }

        setLoading(true);

        try {
          const profile = await HamplusAuth.login(email, password, rememberCheckbox.checked);
          
          // Redirect based on role
          if (profile.role === "supervisor") {
            window.location.href = "supervisor-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        } catch (err) {
          console.error("Login failure:", err);
          showAlert(err.message || "Invalid email or password. Please try again.", "danger");
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
